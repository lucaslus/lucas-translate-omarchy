name: Omarchy native plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install backend build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config dbus wl-clipboard
      - run: cargo fmt --all -- --check
      - run: cargo test --package lucas-core --locked -- --skip network
      - run: cargo test --package lucas-translate-omarchy-backend --locked
      - run: cargo build --locked
      - run: python3 tests/backend_test.py
      - run: python3 -B tests/stability_test.py
      - name: Private Wayland clipboard regression tests
        run: python3 -B tests/selection_wayland_test.py
      - run: python3 tests/shortcuts_test.py
      - run: python3 -B tests/integration_test.py
      - name: Build independent native backend
        run: bash scripts/build-omarchy-native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: omarchy-native
          path: dist/*.tar.gz
          if-no-files-found: error
  native-ui:
    needs: backend
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      OMARCHY_PATH: /tmp/omarchy-runtime
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: opengl
      LIBGL_ALWAYS_SOFTWARE: "1"
      XDG_RUNTIME_DIR: /tmp/lucas-runtime
      LUCAS_NATIVE_BACKEND: /tmp/native-bundle/lucas-translate-omarchy/bin/lucas-translate-omarchy-backend
      LUCAS_PLUGIN_SOURCE: /tmp/native-bundle/lucas-translate-omarchy
    steps:
      - name: Install native UI runtime
        run: pacman -Syu --noconfirm git python quickshell mesa dbus ttf-dejavu jq
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-native
          path: /tmp/native-artifact
      - name: Prepare pinned Omarchy components and backend
        run: |
          mkdir -m700 -p "$XDG_RUNTIME_DIR" /tmp/native-bundle
          tar -xzf /tmp/native-artifact/lucas-translate-omarchy-*-x86_64.tar.gz -C /tmp/native-bundle
          git init "$OMARCHY_PATH"
          git -C "$OMARCHY_PATH" remote add origin https://github.com/omacom/omarchy.git
          git -C "$OMARCHY_PATH" fetch --depth 1 origin c352b62d67456f56ca898d0e23effc1b20c25ca6
          git -C "$OMARCHY_PATH" checkout --detach FETCH_HEAD
          quickshell --version
          pacman -Q qt6-base qt6-declarative
      - name: Validate source and release plugin layouts
        run: |
          bash "$OMARCHY_PATH/bin/omarchy-plugin-validate" "$GITHUB_WORKSPACE"
          bash "$OMARCHY_PATH/bin/omarchy-plugin-validate" "$LUCAS_PLUGIN_SOURCE"
      - name: Prepare unprivileged UI test user
        run: |
          useradd --create-home native-test
          chown -R native-test:native-test "$GITHUB_WORKSPACE" "$XDG_RUNTIME_DIR" /tmp/native-bundle
      - name: Native components, themes and rendered previews
        run: runuser -u native-test -- dbus-run-session -- python3 -B scripts/test-omarchy-native.py
      - name: Native UI interactions and stress
        run: runuser -u native-test -- dbus-run-session -- python3 -B scripts/test-omarchy-ui.py
      - name: QML and Rust integration
        run: runuser -u native-test -- dbus-run-session -- python3 -B scripts/test-omarchy-bridge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omarchy-native-ui-results
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, native-ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          backend = tomllib.loads(Path('crates/lucas-omarchy/Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version and backend == version, 'Tag, manifest and backend versions must match'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: omarchy-native
          path: dist/release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist/release
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes *.tar.gz SHA256SUMS
